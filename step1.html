      pray: `<svg class="w-24 h-24 text-gold-500/10 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`
    };

    // Render Indicator Dots
    function renderDots() {
      dotsContainer.innerHTML = '';
      cardsData.forEach((card, idx) => {
        const dot = document.createElement('button');
        dot.className = `h-2 rounded-full transition-all duration-300 ${idx === currentIndex ? 'w-6 bg-gold-400' : 'w-2 bg-white/20 hover:bg-white/40'}`;
        dot.title = `${idx + 1}번: ${card.category}`;
        dot.onclick = () => goToCard(idx);
        dotsContainer.appendChild(dot);
      });
    }

    // Render Current Card
    function renderCard(index) {
      const data = cardsData[index];
      currentIndex = index;

      // Update header info
      badgeCategory.textContent = data.badge;
      cardIndicator.textContent = `${String(index + 1).padStart(2, '0')} / 13`;

      // Update dots
      renderDots();

      // Render content depending on card type
      let html = '';

      if (data.type === "COVER") {
        html = `
          <!-- Background ambient artwork -->
          <div class="absolute -right-6 -bottom-6 opacity-30 select-none">
            ${ICONS.boat}
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-deep via-transparent to-transparent opacity-80 pointer-events-none"></div>

          <!-- Top Meta -->
          <div class="relative z-10 flex justify-between items-start">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase bg-gold-500/25 text-gold-300 border border-gold-400/40 shadow-sm">
              ${data.series}
            </span>
            <span class="text-[11px] text-slate-400 font-medium">청소년부 찬양팀</span>
          </div>

          <!-- Center Title Area -->
          <div class="relative z-10 my-auto text-center px-2">
            <div class="inline-block mb-3 px-3 py-1 rounded-md bg-white/5 border border-white/10 text-xs text-gold-300/90 font-medium tracking-wide">
              찬양 묵상 스터디 • 1단계
            </div>
            
            <h2 class="font-serif text-3xl sm:text-4xl font-black text-white leading-tight tracking-tight mb-3">
              ${data.mainTitle.split('—')[0]}
            </h2>
            <div class="h-1 w-16 bg-gradient-to-r from-transparent via-gold-400 to-transparent mx-auto mb-4"></div>
            
            <p class="text-sm sm:text-base text-gold-300/90 font-serif font-medium mb-5">
              ${data.subTitle}
            </p>
            
            <p class="text-xs sm:text-sm text-slate-300/90 max-w-xs mx-auto leading-relaxed bg-black/30 backdrop-blur-sm p-3.5 rounded-xl border border-white/10">
              "${data.description}"
            </p>
          </div>

          <!-- Bottom Footer -->
          <div class="relative z-10 pt-3 border-t border-white/10 flex items-center justify-between text-[11px] text-slate-400">
            <span>곡 배경: 「베드로의 고백」</span>
            <span class="flex items-center gap-1 text-gold-400 font-medium animate-pulse">
              옆으로 넘기기 →
            </span>
          </div>
        `;
      } else if (data.type === "GUIDE") {
        html = `
          <!-- Background Icon Decoration -->
          <div class="absolute right-3 top-3 opacity-20 select-none">
            ${ICONS[data.bgIcon] || ''}
          </div>

          <!-- Top Guide Badge & Step -->
          <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-md bg-gold-500/20 text-gold-300 border border-gold-500/30 font-cinzel text-xs font-bold flex items-center justify-center">
                ${data.guideNumber}
              </span>
              <span class="text-xs font-semibold text-gold-400 tracking-wider">GUIDE NOTE</span>
            </div>
            <span class="text-[11px] text-slate-400">가이드 6편 중 ${data.guideNumber}</span>
          </div>

          <!-- Head Copy & Title -->
          <div class="relative z-10 mb-2">
            <p class="text-xs sm:text-sm font-semibold text-gold-300/90 font-serif">
              ${data.headCopy}
            </p>
            <h3 class="text-base sm:text-lg font-bold text-white tracking-tight leading-snug mt-0.5">
              ${data.title}
            </h3>
          </div>

          <!-- Body Content (Scrollable if text exceeds height) -->
          <div class="relative z-10 flex-1 overflow-y-auto custom-scroll pr-1 my-1">
            <div class="text-slate-300 leading-relaxed space-y-2.5 font-normal text-justify" style="font-size: ${baseFontSize}px;">
              ${data.content.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')}
            </div>
          </div>

          <!-- Highlight Box: Praise Team Point -->
          <div class="relative z-10 mt-2 bg-gradient-to-r from-gold-500/15 via-navy-800 to-navy-900 border-l-4 border-gold-400 p-2.5 sm:p-3 rounded-r-xl shadow-md">
            <div class="flex items-center gap-1.5 text-gold-400 text-[11px] font-bold uppercase tracking-wider mb-1">
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
              </svg>
              찬양팀 묵상 포인트
            </div>
            <p class="text-xs sm:text-[13px] text-slate-100 font-medium leading-snug">
              ${data.point}
            </p>
          </div>
        `;
      } else if (data.type === "SCRIPTURE") {
        html = `
          <!-- Scripture Header -->
          <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-sky-500/20 text-sky-300 border border-sky-500/30">
                표준새번역
              </span>
              <span class="text-xs font-serif font-bold text-slate-200">${data.passage}</span>
            </div>
            <svg class="w-4 h-4 text-gold-400/60" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H8l5-7v4h3l-5 7z"/>
            </svg>
          </div>

          <!-- Scripture Title -->
          <div class="relative z-10 mb-2">
            <h3 class="text-sm sm:text-base font-bold text-gold-300 font-serif">
              ${data.theme}
            </h3>
          </div>

          <!-- Scripture Body Box (Parchment Styled Dark) -->
          <div class="relative z-10 flex-1 scripture-card rounded-xl p-3 sm:p-4 border border-gold-500/20 overflow-y-auto custom-scroll">
            <div class="space-y-3 font-serif text-slate-200" style="font-size: ${baseFontSize}px;">
              ${data.verses.map(v => {
                if (v.speaker && !v.highlight) {
                  return `<div class="text-[11px] font-sans font-bold text-sky-400 mt-2">[${v.speaker}]</div><p class="leading-relaxed opacity-90">${v.text}</p>`;
                }
                if (v.highlight) {
                  return `
                    <div class="bg-gold-500/10 border-l-2 border-gold-400 pl-3 py-1 my-1 rounded-r-md">
                      ${v.speaker ? `<span class="block text-[10px] font-sans font-bold text-gold-400 uppercase tracking-wider mb-0.5">${v.speaker}</span>` : ''}
                      <p class="text-gold-200 font-semibold leading-relaxed">${v.text}</p>
                    </div>
                  `;
                }
                return `<p class="leading-relaxed text-slate-300 text-justify">${v.text}</p>`;
              }).join('')}
            </div>
          </div>

          <!-- Bottom Footer Citation -->
          <div class="relative z-10 pt-2 text-right text-[10px] text-slate-400 font-mono">
            대한성서공회 표준새번역
          </div>
        `;
      } else if (data.type === "SHARING") {
        html = `
          <!-- Header -->
          <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-amber-500/20 text-gold-300 border border-gold-500/40">
                APPLICATION
              </span>
              <span class="text-xs font-bold text-white tracking-wide">찬양팀 나눔 & 기도</span>
            </div>
            <span class="text-[11px] text-slate-400">마무리 적용</span>
          </div>

          <!-- Title -->
          <div class="relative z-10 mb-2">
            <h3 class="text-base sm:text-lg font-bold text-white font-serif">
              ${data.title}
            </h3>
            <p class="text-xs text-gold-300/90 font-medium">
              ${data.headCopy}
            </p>
          </div>

          <!-- Scripture snippet -->
          <div class="relative z-10 bg-black/40 border border-white/10 rounded-lg p-2.5 mb-2.5 text-xs text-slate-300 font-serif leading-relaxed">
            <p class="italic text-gold-200/90">${data.scriptureSnip.replace(/\n/g, '<br>')}</p>
          </div>

          <!-- 3 Questions & Prayer Box -->
          <div class="relative z-10 flex-1 overflow-y-auto custom-scroll pr-1 space-y-2">
            ${data.questions.map((item, qIdx) => `
              <div class="bg-navy-900/90 border border-white/10 rounded-xl p-2.5 hover:border-gold-500/40 transition">
                <h4 class="text-xs font-bold ${qIdx === 2 ? 'text-gold-300' : 'text-sky-300'} mb-1 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full ${qIdx === 2 ? 'bg-gold-400' : 'bg-sky-400'}"></span>
                  ${item.q}
                </h4>
                <p class="text-[12px] text-slate-300 leading-snug text-justify">
                  ${item.desc}
                </p>
              </div>
            `).join('')}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // Navigation Controls
    function goToCard(idx) {
      if (idx < 0) idx = 0;
      if (idx >= cardsData.length) idx = cardsData.length - 1;
      currentIndex = idx;
      renderCard(currentIndex);
    }

    function prevCard() {
      if (currentIndex > 0) {
        goToCard(currentIndex - 1);
      } else {
        showToast("첫 번째 카드입니다.");
      }
    }

    function nextCard() {
      if (currentIndex < cardsData.length - 1) {
        goToCard(currentIndex + 1);
      } else {
        showToast("마지막 카드입니다. 전체 모아보기를 확인해보세요!");
      }
    }

    // Keyboard Arrow Navigation
    window.addEventListener('keydown', (e) => {
      if (gridView.classList.contains('hidden')) {
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === 'ArrowRight') nextCard();
      }
    });

    // Touch Swipe Gestures for Mobile
    let touchStartX = 0;
    let touchEndX = 0;

    container.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const threshold = 40;
      if (touchEndX < touchStartX - threshold) {
        // Swiped Left -> Go Next
        nextCard();
      } else if (touchEndX > touchStartX + threshold) {
        // Swiped Right -> Go Prev
        prevCard();
      }
    }

    // Buttons Listeners
    prevBtn.addEventListener('click', prevCard);
    nextBtn.addEventListener('click', nextCard);

    // Font Resizing
    fontPlus.addEventListener('click', () => {
      if (baseFontSize < 18) {
        baseFontSize += 1;
        renderCard(currentIndex);
      }
    });

    fontMinus.addEventListener('click', () => {
      if (baseFontSize > 12) {
        baseFontSize -= 1;
        renderCard(currentIndex);
      }
    });

    // Grid View Generation
    function buildGridView() {
      gridCardsContainer.innerHTML = '';
      cardsData.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = "group bg-navy-900 border border-white/10 hover:border-gold-400/60 rounded-xl p-4 cursor-pointer transition transform hover:-translate-y-1 shadow-lg flex flex-col justify-between h-48";
        
        let previewTitle = c.mainTitle || c.title || c.theme;
        let previewSub = c.subTitle || c.headCopy || c.passage || '';
        
        item.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded ${c.type === 'SCRIPTURE' ? 'bg-sky-500/20 text-sky-300' : 'bg-gold-500/20 text-gold-300'} uppercase font-mono">
                ${c.badge}
              </span>
              <span class="text-[11px] text-slate-500 font-mono">${String(idx + 1).padStart(2, '0')}/13</span>
            </div>
            <h4 class="text-xs sm:text-sm font-bold text-white group-hover:text-gold-300 transition line-clamp-2">
              ${previewTitle}
            </h4>
            <p class="text-[11px] text-slate-400 mt-1 line-clamp-2">
              ${previewSub.replace(/[“”"]/g, '')}
            </p>
          </div>
          <div class="text-[10px] text-gold-400/80 font-medium flex items-center justify-end gap-1">
            보기 →
          </div>
        `;
        item.onclick = () => {
          goToCard(idx);
          toggleViews();
        };
        gridCardsContainer.appendChild(item);
      });
    }

    function toggleViews() {
      const isGridHidden = gridView.classList.contains('hidden');
      if (isGridHidden) {
        buildGridView();
        sliderView.classList.add('hidden');
        gridView.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        gridView.classList.add('hidden');
        sliderView.classList.remove('hidden');
      }
    }

    gridToggleBtn.addEventListener('click', toggleViews);
    closeGridBtn.addEventListener('click', toggleViews);

    // Format Text for Copying to KakaoTalk / SNS
    function getCardPlainText(data) {
      const divider = "=========================";
      let text = `[청소년부 찬양팀 묵상] 베드로의 고백 - 1단계\nCard ${String(data.id + 1).padStart(2, '0')}: ${data.badge}\n${divider}\n`;

      if (data.type === "COVER") {
        text += `[${data.mainTitle}]\n${data.subTitle}\n\n"${data.description}"\n\n- 찬양 곡: 「베드로의 고백」\n- 청소년부 찬양팀 묵상 1단계`;
      } else if (data.type === "GUIDE") {
        text += `★ ${data.title}\n\n${data.headCopy}\n\n${data.content}\n\n💡 [찬양팀 묵상 포인트]\n${data.point}`;
      } else if (data.type === "SCRIPTURE") {
        text += `📖 [말씀] ${data.theme}\n(${data.passage})\n\n`;
        text += data.verses.map(v => (v.speaker ? `[${v.speaker}] ` : '') + v.text).join('\n\n');
      } else if (data.type === "SHARING") {
        text += `🙏 ${data.title}\n\n${data.headCopy}\n\n${data.scriptureSnip}\n\n[찬양팀 나눔 & 기도 질문]\n`;
        text += data.questions.map(q => `${q.q}\n: ${q.desc}`).join('\n\n');
      }

      return text;
    }

    // Copy using document.execCommand('copy')
    copyCardBtn.addEventListener('click', () => {
      const data = cardsData[currentIndex];
      const copyText = getCardPlainText(data);

      const textarea = document.createElement('textarea');
      textarea.value = copyText;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast(`Card ${currentIndex + 1} 내용이 복사되었습니다! 단톡방에 붙여넣으세요.`);
        } else {
          showToast("복사에 실패했습니다. 수동으로 텍스트를 복사해주세요.");
        }
      } catch (err) {
        showToast("클립보드 접근이 차단되어 있습니다.");
      } finally {
        document.body.removeChild(textarea);
      }
    });

    // Custom Toast Notification (Never use alert)
    let toastTimeout = null;
    function showToast(message) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsg.textContent = message;
      toastBox.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toastBox.classList.add('opacity-100', 'translate-y-0');

      toastTimeout = setTimeout(() => {
        toastBox.classList.remove('opacity-100', 'translate-y-0');
        toastBox.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      }, 2600);
    }

    // Initialize on page load
    window.onload = function() {
      renderCard(0);
    };
  </script>
</body>
</html>
