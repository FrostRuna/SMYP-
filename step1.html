      rock: `<svg class="w-24 h-24 text-gold-400/10 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M19.5 9.5L16 3H8L4.5 9.5 2 17l6 4h8l6-4-2.5-7.5zM12 5.5l2.5 4.5h-5L12 5.5z"/></svg>`,
      sword: `<svg class="w-24 h-24 text-rose-400/10 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M6.92 5H5l9 9 1.42-1.42L6.92 5zm11.78 11.08l-2.83-2.83-1.41 1.41 2.83 2.83-2.12 2.12 1.41 1.41 2.12-2.12 2.12 2.12 1.41-1.41-2.12-2.12 1.41-1.41-2.82-2.82zM14.5 9.5L12 7 3 16l2.5 2.5 9-9z"/></svg>`,
      hands: `<svg class="w-24 h-24 text-gold-400/10 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
      pray: `<svg class="w-24 h-24 text-gold-400/10 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`
    };

    // 페이지네이션 도트(1~13) 렌더링
    function renderDots() {
      dotsContainer.innerHTML = '';
      cardsData.forEach((card, idx) => {
        const dot = document.createElement('button');
        const isActive = idx === currentIndex;
        dot.type = 'button';
        dot.setAttribute('aria-label', `${idx + 1}번 카드 (${card.category})`);
        dot.setAttribute('aria-selected', isActive ? 'true' : 'false');
        dot.className = `h-2.5 rounded-full transition-all duration-300 cursor-pointer ${
          isActive
            ? 'w-7 bg-gold-400 shadow-sm shadow-gold-400/60'
            : 'w-2.5 bg-white/20 hover:bg-gold-300/60'
        }`;
        dot.title = `${String(idx + 1).padStart(2, '0')}번: ${card.category}`;
        dot.onclick = () => goToCard(idx);
        dotsContainer.appendChild(dot);
      });
    }

    // 현재 카드 렌더링
    function renderCard(index) {
      const data = cardsData[index];
      currentIndex = index;

      badgeCategory.textContent = data.badge;
      cardCategoryLabel.textContent = data.category;
      cardIndicator.textContent = `${String(index + 1).padStart(2, '0')} / 13`;

      renderDots();

      let html = '';

      if (data.type === "COVER") {
        html = `
          <!-- 배경 장식 -->
          <div class="absolute -right-5 -bottom-5 opacity-35 select-none">
            ${ICONS.boat}
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-deep via-transparent to-transparent opacity-80 pointer-events-none"></div>

          <!-- 상단 메타 -->
          <div class="relative z-10 flex justify-between items-center">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase bg-gold-500/20 text-gold-300 border border-gold-400/40">
              ${data.series}
            </span>
            <span class="text-[11px] text-slate-300 font-medium">청소년부 찬양팀</span>
          </div>

          <!-- 중앙 타이틀 -->
          <div class="relative z-10 my-auto text-center px-1">
            <div class="inline-block mb-3 px-3 py-1 rounded-full bg-white/5 border border-gold-500/25 text-[11px] text-gold-300 font-medium">
              ${data.seriesBanner}
            </div>
            
            <h2 class="font-serif text-3xl sm:text-4xl font-black text-white leading-tight tracking-tight mb-3">
              열정 100%, 실수 100%
            </h2>
            <div class="h-1 w-20 bg-gradient-to-r from-transparent via-gold-400 to-transparent mx-auto mb-4"></div>
            
            <p class="text-base sm:text-lg text-gold-300 font-serif font-bold mb-5">
              ${data.subTitle}
            </p>
            
            <p class="text-xs sm:text-sm text-slate-200 max-w-sm mx-auto leading-relaxed bg-deep/65 backdrop-blur-sm p-4 rounded-2xl border border-gold-500/20">
              “${data.description}”
            </p>
          </div>

          <!-- 하단 안내 -->
          <div class="relative z-10 pt-3 border-t border-white/10 flex items-center justify-between text-[11px] text-slate-400">
            <span>찬양 곡: 「베드로의 고백」</span>
            <span class="text-gold-300 font-medium">밀어서 묵상 시작 →</span>
          </div>
        `;
      } else if (data.type === "GUIDE") {
        html = `
          <!-- 배경 아이콘 -->
          <div class="absolute right-4 top-4 opacity-20 select-none">
            ${ICONS[data.bgIcon] || ''}
          </div>

          <!-- 상단 가이드 헤더 -->
          <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-2.5 mb-2.5">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-md bg-gold-500/20 text-gold-300 border border-gold-500/40 font-cinzel text-xs font-bold flex items-center justify-center">
                ${data.guideNumber}
              </span>
              <span class="text-xs font-bold text-gold-400 tracking-wider">GUIDE NOTE</span>
            </div>
            <span class="text-[11px] text-slate-400">가이드 6편 중 ${data.guideNumber}</span>
          </div>

          <!-- 헤드카피 및 소제목 -->
          <div class="relative z-10 mb-2.5">
            <p class="text-xs sm:text-sm font-semibold text-gold-300 font-serif">
              ${data.headCopy}
            </p>
            <h3 class="text-base sm:text-lg font-bold text-white tracking-tight leading-snug mt-0.5">
              ${data.title}
            </h3>
          </div>

          <!-- 본문 (좌우 버튼 가림 없이 전체 너비 활용) -->
          <div class="relative z-10 flex-1 overflow-y-auto custom-scroll pr-1 my-1">
            <div class="text-slate-200 leading-relaxed space-y-2.5 font-normal text-justify" style="font-size: ${baseFontSize}px;">
              ${data.content.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')}
            </div>
          </div>

          <!-- 하단 찬양팀 묵상 포인트 박스 -->
          <div class="relative z-10 mt-2.5 bg-gradient-to-r from-gold-500/15 via-navy-800 to-navySurface border-l-4 border-gold-400 p-3 rounded-r-xl shadow-md">
            <div class="flex items-center gap-1.5 text-gold-300 text-[11px] font-bold uppercase tracking-wider mb-1">
              <svg class="w-3.5 h-3.5 text-gold-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
              </svg>
              찬양팀 묵상 포인트
            </div>
            <p class="text-xs sm:text-[13px] text-slate-100 font-medium leading-snug">
              ${data.point}
            </p>
          </div>
        `;
      } else if (data.type === "SCRIPTURE") {
        html = `
          <!-- 말씀 상단 헤더 -->
          <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-2.5 mb-2.5">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-gold-500/20 text-gold-300 border border-gold-500/35">
                표준새번역
              </span>
              <span class="text-xs font-serif font-bold text-slate-100">${data.passage}</span>
            </div>
          </div>

          <!-- 말씀 주제 -->
          <div class="relative z-10 mb-2.5">
            <h3 class="text-sm sm:text-base font-bold text-gold-300 font-serif">
              ${data.theme}
            </h3>
          </div>

          <!-- 성경 구절 본문 박스 -->
          <div class="relative z-10 flex-1 scripture-card rounded-2xl p-3.5 sm:p-4 border border-gold-500/25 overflow-y-auto custom-scroll">
            <div class="space-y-3 font-serif text-slate-100" style="font-size: ${baseFontSize}px;">
              ${data.verses.map(v => {
                if (v.speaker && !v.highlight) {
                  return `<div class="text-[11px] font-sans font-bold text-gold-400 mt-2">[${v.speaker}]</div><p class="leading-relaxed opacity-95">${v.text}</p>`;
                }
                if (v.highlight) {
                  return `
                    <div class="bg-gold-500/12 border-l-2 border-gold-400 pl-3 py-1.5 my-1 rounded-r-md">
                      ${v.speaker ? `<span class="block text-[10px] font-sans font-bold text-gold-300 uppercase tracking-wider mb-0.5">${v.speaker}</span>` : ''}
                      <p class="text-gold-300 font-semibold leading-relaxed">${v.text}</p>
                    </div>
                  `;
                }
                return `<p class="leading-relaxed text-slate-200 text-justify">${v.text}</p>`;
              }).join('')}
            </div>
          </div>

          <!-- 하단 출처 -->
          <div class="relative z-10 pt-2 text-right text-[10px] text-slate-400 font-mono">
            대한성서공회 표준새번역
          </div>
        `;
      } else if (data.type === "SHARING") {
        html = `
          <!-- 나눔 & 기도 상단 헤더 -->
          <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-gold-500/25 text-gold-300 border border-gold-400/45">
                APPLICATION
              </span>
              <span class="text-xs font-bold text-white tracking-wide">찬양팀 나눔 & 기도</span>
            </div>
            <span class="text-[11px] text-gold-300 font-medium">1단계 마무리</span>
          </div>

          <!-- 타이틀 -->
          <div class="relative z-10 mb-2">
            <h3 class="text-base sm:text-lg font-bold text-white font-serif">
              ${data.title}
            </h3>
            <p class="text-xs text-gold-300 font-medium">
              ${data.headCopy}
            </p>
          </div>

          <!-- 본문 말씀 요약 -->
          <div class="relative z-10 bg-deep/75 border border-gold-500/20 rounded-xl p-2.5 mb-2 text-xs text-slate-200 font-serif leading-relaxed">
            <p class="italic text-gold-300/95">${data.scriptureSnip.replace(/\n/g, '<br>')}</p>
          </div>

          <!-- 질문 3가지 & 기도문 + 다음 단계 이동 버튼 -->
          <div class="relative z-10 flex-1 overflow-y-auto custom-scroll pr-1 space-y-2">
            ${data.questions.map((item, qIdx) => `
              <div class="bg-navySurface/95 border border-white/10 rounded-xl p-2.5 hover:border-gold-400/40 transition">
                <h4 class="text-xs font-bold ${qIdx === 2 ? 'text-gold-300' : 'text-gold-400'} mb-1 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-gold-400"></span>
                  ${item.q}
                </h4>
                <p class="text-[12px] text-slate-200 leading-snug text-justify">
                  ${item.desc}
                </p>
              </div>
            `).join('')}

            <!-- 하단 이동 버튼 (대문으로 / 2단계로) -->
            <div class="pt-2.5 grid grid-cols-2 gap-2">
              <a href="index.html" class="py-2.5 px-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/15 text-xs font-semibold text-slate-200 hover:text-white text-center transition flex items-center justify-center gap-1.5">
                <span>⌂ 대문으로</span>
              </a>
              <a href="step2.html" class="py-2.5 px-3 rounded-xl bg-gold-500/25 hover:bg-gold-500/35 border border-gold-400/50 text-xs font-bold text-gold-300 hover:text-white text-center transition flex items-center justify-center gap-1.5">
                <span>2단계로 →</span>
              </a>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // 카드 이동 제어
    function goToCard(idx) {
      if (idx < 0) idx = 0;
      if (idx >= cardsData.length) idx = cardsData.length - 1;
      currentIndex = idx;
      renderCard(currentIndex);
    }

    function prevCard() {
      if (currentIndex > 0) {
        goToCard(currentIndex - 1);
      } else {
        showToast("첫 번째 카드입니다.");
      }
    }

    function nextCard() {
      if (currentIndex < cardsData.length - 1) {
        goToCard(currentIndex + 1);
      } else {
        showToast("마지막 카드입니다. 2단계로 이동하거나 모아보기를 확인해보세요!");
      }
    }

    // 키보드 좌우 방향키 이동
    window.addEventListener('keydown', (e) => {
      if (gridView.classList.contains('hidden')) {
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === 'ArrowRight') nextCard();
      }
    });

    // 모바일 터치 스와이프 제스처
    let touchStartX = 0;
    let touchStartY = 0;

    container.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // 수직 스크롤보다 수평 스와이프 의도가 명확할 때만 페이지 전환
      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) {
          nextCard();
        } else {
          prevCard();
        }
      }
    }, { passive: true });

    // 본문 글자 크기 조절
    fontPlus.addEventListener('click', () => {
      if (baseFontSize < 18) {
        baseFontSize += 1;
        renderCard(currentIndex);
        showToast(`글자 크기 확대 (${baseFontSize}px)`);
      }
    });

    fontMinus.addEventListener('click', () => {
      if (baseFontSize > 12) {
        baseFontSize -= 1;
        renderCard(currentIndex);
        showToast(`글자 크기 축소 (${baseFontSize}px)`);
      }
    });

    // 13장 전체 모아보기 그리드 생성
    function buildGridView() {
      gridCardsContainer.innerHTML = '';
      cardsData.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = "group bg-navySurface border border-white/10 hover:border-gold-400/60 rounded-2xl p-4 cursor-pointer transition transform hover:-translate-y-1 shadow-lg flex flex-col justify-between h-48";
        
        const previewTitle = c.mainTitle || c.title || c.theme;
        const previewSub = c.subTitle || c.headCopy || c.passage || '';
        
        item.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-gold-500/20 text-gold-300 border border-gold-500/30 uppercase font-mono">
                ${c.badge}
              </span>
              <span class="text-[11px] text-slate-400 font-mono">${String(idx + 1).padStart(2, '0')} / 13</span>
            </div>
            <h4 class="text-xs sm:text-sm font-bold text-white group-hover:text-gold-300 transition line-clamp-2">
              ${previewTitle}
            </h4>
            <p class="text-[11px] text-slate-400 mt-1.5 line-clamp-2">
              ${previewSub.replace(/[“”"]/g, '')}
            </p>
          </div>
          <div class="text-[11px] text-gold-400 font-semibold flex items-center justify-end gap-1">
            카드 열기 →
          </div>
        `;
        item.onclick = () => {
          goToCard(idx);
          toggleViews();
        };
        gridCardsContainer.appendChild(item);
      });
    }

    function toggleViews() {
      const isGridHidden = gridView.classList.contains('hidden');
      if (isGridHidden) {
        buildGridView();
        sliderView.classList.add('hidden');
        gridView.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        gridView.classList.add('hidden');
        sliderView.classList.remove('hidden');
      }
    }

    gridToggleBtn.addEventListener('click', toggleViews);
    closeGridBtn.addEventListener('click', toggleViews);

    // 단톡방 공유용 텍스트 포맷팅
    function getCardPlainText(data) {
      const divider = "=========================";
      let text = `[청소년부 찬양팀 묵상] 베드로의 고백 - 1단계\nCard ${String(data.id + 1).padStart(2, '0')}: ${data.badge}\n${divider}\n`;

      if (data.type === "COVER") {
        text += `[${data.mainTitle}]\n${data.subTitle}\n(${data.seriesBanner})\n\n"${data.description}"\n\n- 찬양 곡: 「베드로의 고백」\n- 청소년부 찬양팀 묵상 1단계`;
      } else if (data.type === "GUIDE") {
        text += `★ ${data.title}\n\n${data.headCopy}\n\n${data.content}\n\n💡 [찬양팀 묵상 포인트]\n${data.point}`;
      } else if (data.type === "SCRIPTURE") {
        text += `📖 [말씀] ${data.theme}\n(${data.passage})\n\n`;
        text += data.verses.map(v => (v.speaker ? `[${v.speaker}] ` : '') + v.text).join('\n\n');
      } else if (data.type === "SHARING") {
        text += `🙏 ${data.title}\n\n${data.headCopy}\n\n${data.scriptureSnip}\n\n[찬양팀 나눔 & 기도 질문]\n`;
        text += data.questions.map(q => `${q.q}\n: ${q.desc}`).join('\n\n');
      }

      return text;
    }

    // 클립보드 복사 (document.execCommand 사용)
    copyCardBtn.addEventListener('click', () => {
      const data = cardsData[currentIndex];
      const copyText = getCardPlainText(data);

      const textarea = document.createElement('textarea');
      textarea.value = copyText;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast(`Card ${String(currentIndex + 1).padStart(2, '0')} 내용이 복사되었습니다! 단톡방에 붙여넣으세요.`);
        } else {
          showToast("복사에 실패했습니다. 수동으로 텍스트를 복사해주세요.");
        }
      } catch (err) {
        showToast("클립보드 접근이 차단되어 있습니다.");
      } finally {
        document.body.removeChild(textarea);
      }
    });

    // 커스텀 토스트 메시지
    let toastTimeout = null;
    function showToast(message) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsg.textContent = message;
      toastBox.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toastBox.classList.add('opacity-100', 'translate-y-0');

      toastTimeout = setTimeout(() => {
        toastBox.classList.remove('opacity-100', 'translate-y-0');
        toastBox.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      }, 2600);
    }

    // 페이지 로드 시 초기화
    window.onload = function() {
      renderCard(0);
    };
  </script>
</body>
</html>
