      rooster: `<svg class="w-24 h-24 text-amber-500/15 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm0-4h-2V7h2v7z"/></svg>`,
      boat: `<svg class="w-24 h-24 text-warmGold-500/15 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M20 21c-1.39 0-2.78-.47-4-1.32-2.44 1.71-5.56 1.71-8 0C6.78 20.53 5.39 21 4 21H2v2h2c1.38 0 2.74-.35 4-.99 2.52 1.29 5.48 1.29 8 0 1.26.65 2.62.99 4 .99h2v-2h-2zM3.95 19H4c1.6 0 3.02-.88 4-2 .98 1.12 2.4 2 4 2s3.02-.88 4-2c.98 1.12 2.4 2 4 2h.05l1.89-6.62c.12-.42-.03-.88-.38-1.15-.35-.28-.83-.32-1.22-.11L19 12.2V4c0-.55-.45-1-1-1s-1 .45-1 1v7.09l-3.34-1.67c-.42-.21-.92-.15-1.28.14L10 11.2V2c0-.55-.45-1-1-1s-1 .45-1 1v8.52L5.66 9.12c-.39-.21-.87-.17-1.22.11-.35.27-.5.73-.38 1.15L5.95 17z"/></svg>`,
      heart: `<svg class="w-24 h-24 text-rose-500/15 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
      harp: `<svg class="w-24 h-24 text-warmGold-400/15 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`,
      cross: `<svg class="w-24 h-24 text-ember-400/15 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M11 2h2v6h6v2h-6v12h-2V10H5V8h6V2z"/></svg>`,
      pray: `<svg class="w-24 h-24 text-warmGold-500/15 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`
    };

    // Render Indicator Dots
    function renderDots() {
      dotsContainer.innerHTML = '';
      cardsData.forEach((card, idx) => {
        const dot = document.createElement('button');
        dot.className = `h-2 rounded-full transition-all duration-300 ${idx === currentIndex ? 'w-6 bg-ember-500 shadow-sm shadow-ember-500/50' : 'w-2 bg-white/20 hover:bg-white/40'}`;
        dot.title = `${idx + 1}번: ${card.category}`;
        dot.onclick = () => goToCard(idx);
        dotsContainer.appendChild(dot);
      });
    }

    // Render Current Card
    function renderCard(index) {
      const data = cardsData[index];
      currentIndex = index;

      badgeCategory.textContent = data.badge;
      cardIndicator.textContent = `${String(index + 1).padStart(2, '0')} / 13`;

      renderDots();

      let html = '';

      if (data.type === "COVER") {
        html = `
          <!-- Ambient glowing background fire icon -->
          <div class="absolute -right-4 -bottom-4 opacity-35 select-none animate-pulse">
            ${ICONS.fire}
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-deep via-transparent to-transparent opacity-85 pointer-events-none"></div>

          <!-- Top Meta -->
          <div class="relative z-10 flex justify-between items-start">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase bg-ember-500/20 text-ember-300 border border-ember-400/40 shadow-sm">
              ${data.series}
            </span>
            <span class="text-[11px] text-warmGold-400/80 font-medium">청소년부 찬양팀</span>
          </div>

          <!-- Center Title Area -->
          <div class="relative z-10 my-auto text-center px-2">
            <div class="inline-block mb-3 px-3 py-1 rounded-md bg-white/5 border border-white/10 text-xs text-warmGold-300 font-medium tracking-wide">
              찬양 묵상 스터디 • 2단계
            </div>
            
            <h2 class="font-serif text-3xl sm:text-4xl font-black text-white leading-tight tracking-tight mb-3">
              ${data.mainTitle}
            </h2>
            <div class="h-1 w-20 bg-gradient-to-r from-transparent via-ember-500 to-transparent mx-auto mb-4"></div>
            
            <p class="text-xs sm:text-sm text-warmGold-300/90 font-serif font-medium mb-5 leading-snug">
              ${data.subTitle}
            </p>
            
            <div class="text-xs sm:text-[13px] text-slate-300 max-w-xs mx-auto leading-relaxed bg-black/40 backdrop-blur-sm p-3.5 rounded-xl border border-white/10">
              ${data.description.replace(/\n/g, '<br>')}
            </div>
          </div>

          <!-- Bottom Footer -->
          <div class="relative z-10 pt-3 border-t border-white/10 flex items-center justify-between text-[11px] text-slate-400">
            <span>곡 배경: 「베드로의 고백」</span>
            <span class="flex items-center gap-1 text-ember-400 font-medium animate-pulse">
              옆으로 넘기기 →
            </span>
          </div>
        `;
      } else if (data.type === "GUIDE") {
        html = `
          <!-- Ambient icon -->
          <div class="absolute right-3 top-3 opacity-20 select-none">
            ${ICONS[data.bgIcon] || ''}
          </div>

          <!-- Top Guide Badge -->
          <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-md bg-ember-500/25 text-ember-300 border border-ember-500/40 font-cinzel text-xs font-bold flex items-center justify-center">
                ${data.guideNumber}
              </span>
              <span class="text-xs font-semibold text-ember-400 tracking-wider">GUIDE NOTE</span>
            </div>
            <span class="text-[11px] text-slate-400">가이드 6편 중 ${data.guideNumber}</span>
          </div>

          <!-- Head Copy & Title -->
          <div class="relative z-10 mb-2">
            <p class="text-xs sm:text-sm font-semibold text-warmGold-300/90 font-serif">
              ${data.headCopy}
            </p>
            <h3 class="text-base sm:text-lg font-bold text-white tracking-tight leading-snug mt-0.5">
              ${data.title}
            </h3>
          </div>

          <!-- Body Content -->
          <div class="relative z-10 flex-1 overflow-y-auto custom-scroll pr-1 my-1">
            <div class="text-slate-300 leading-relaxed space-y-2.5 font-normal text-justify" style="font-size: ${baseFontSize}px;">
              ${data.content.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')}
            </div>
          </div>

          <!-- Highlight Box: Praise Team Point -->
          <div class="relative z-10 mt-2 bg-gradient-to-r from-ember-600/20 via-charcoal to-[#0f1424] border-l-4 border-ember-500 p-2.5 sm:p-3 rounded-r-xl shadow-md">
            <div class="flex items-center gap-1.5 text-ember-400 text-[11px] font-bold uppercase tracking-wider mb-1">
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
              </svg>
              찬양팀 묵상 포인트
            </div>
            <p class="text-xs sm:text-[13px] text-slate-100 font-medium leading-snug">
              ${data.point}
            </p>
          </div>
        `;
      } else if (data.type === "SCRIPTURE") {
        html = `
          <!-- Header -->
          <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-warmGold-500/20 text-warmGold-300 border border-warmGold-500/40">
                표준새번역
              </span>
              <span class="text-xs font-serif font-bold text-slate-200">${data.passage}</span>
            </div>
            <svg class="w-4 h-4 text-ember-400/70" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H8l5-7v4h3l-5 7z"/>
            </svg>
          </div>

          <!-- Title -->
          <div class="relative z-10 mb-2">
            <h3 class="text-sm sm:text-base font-bold text-warmGold-300 font-serif">
              ${data.theme}
            </h3>
          </div>

          <!-- Scripture Body Box -->
          <div class="relative z-10 flex-1 scripture-box rounded-xl p-3 sm:p-4 border border-ember-500/20 overflow-y-auto custom-scroll">
            <div class="space-y-3 font-serif text-slate-200" style="font-size: ${baseFontSize}px;">
              ${data.verses.map(v => {
                if (v.speaker && !v.highlight) {
                  return `<div class="text-[11px] font-sans font-bold text-ember-400 mt-2">[${v.speaker}]</div><p class="leading-relaxed opacity-90">${v.text}</p>`;
                }
                if (v.highlight) {
                  return `
                    <div class="bg-ember-500/15 border-l-2 border-ember-400 pl-3 py-1.5 my-1 rounded-r-md">
                      ${v.speaker ? `<span class="block text-[10px] font-sans font-bold text-warmGold-400 uppercase tracking-wider mb-0.5">${v.speaker}</span>` : ''}
                      <p class="text-warmGold-200 font-semibold leading-relaxed">${v.text}</p>
                    </div>
                  `;
                }
                return `<p class="leading-relaxed text-slate-300 text-justify">${v.text}</p>`;
              }).join('')}
            </div>
          </div>

          <!-- Bottom Footer -->
          <div class="relative z-10 pt-2 text-right text-[10px] text-slate-400 font-mono">
            대한성서공회 표준새번역
          </div>
        `;
      } else if (data.type === "SHARING") {
        html = `
          <!-- Header -->
          <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-ember-500/25 text-ember-300 border border-ember-500/40">
                APPLICATION
              </span>
              <span class="text-xs font-bold text-white tracking-wide">2단계 나눔 & 기도</span>
            </div>
            <span class="text-[11px] text-slate-400">마무리 적용</span>
          </div>

          <!-- Title -->
          <div class="relative z-10 mb-2">
            <h3 class="text-base sm:text-lg font-bold text-white font-serif">
              ${data.title}
            </h3>
            <p class="text-xs text-warmGold-300/90 font-medium">
              ${data.headCopy}
            </p>
          </div>

          <!-- Scripture snippet -->
          <div class="relative z-10 bg-black/45 border border-white/10 rounded-lg p-2.5 mb-2 text-xs text-slate-300 font-serif leading-relaxed">
            <p class="italic text-warmGold-200/90">${data.scriptureSnip.replace(/\n/g, '<br>')}</p>
          </div>

          <!-- Questions Box -->
          <div class="relative z-10 flex-1 overflow-y-auto custom-scroll pr-1 space-y-2">
            ${data.questions.map((item, qIdx) => `
              <div class="bg-[#0e1424]/90 border border-white/10 rounded-xl p-2.5 hover:border-ember-500/40 transition">
                <h4 class="text-xs font-bold ${qIdx === 2 ? 'text-warmGold-300' : 'text-ember-300'} mb-1 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full ${qIdx === 2 ? 'bg-warmGold-400' : 'bg-ember-400'}"></span>
                  ${item.q}
                </h4>
                <p class="text-[12px] text-slate-300 leading-snug text-justify">
                  ${item.desc}
                </p>
              </div>
            `).join('')}

            <!-- Bottom Navigation Link Bar -->
            <div class="pt-2 flex items-center justify-between text-xs text-slate-400">
              <a href="step1.html" class="flex items-center gap-1 hover:text-warmGold-300 transition">
                <span>← 1단계: 베드로의 생애</span>
              </a>
              <a href="index.html" class="flex items-center gap-1 text-ember-400 hover:text-white transition">
                <span>전체 목차 홈 ⌂</span>
              </a>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // Navigation Controls
    function goToCard(idx) {
      if (idx < 0) idx = 0;
      if (idx >= cardsData.length) idx = cardsData.length - 1;
      currentIndex = idx;
      renderCard(currentIndex);
    }

    function prevCard() {
      if (currentIndex > 0) {
        goToCard(currentIndex - 1);
      } else {
        showToast("첫 번째 카드입니다.");
      }
    }

    function nextCard() {
      if (currentIndex < cardsData.length - 1) {
        goToCard(currentIndex + 1);
      } else {
        showToast("마지막 카드입니다. 전체 모아보기를 확인해보세요!");
      }
    }

    // Keyboard Arrow Navigation
    window.addEventListener('keydown', (e) => {
      if (gridView.classList.contains('hidden')) {
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === 'ArrowRight') nextCard();
      }
    });

    // Touch Swipe Gestures
    let touchStartX = 0;
    let touchEndX = 0;

    container.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const threshold = 40;
      if (touchEndX < touchStartX - threshold) {
        nextCard();
      } else if (touchEndX > touchStartX + threshold) {
        prevCard();
      }
    }

    // Buttons
    prevBtn.addEventListener('click', prevCard);
    nextBtn.addEventListener('click', nextCard);

    // Font Resizing
    fontPlus.addEventListener('click', () => {
      if (baseFontSize < 18) {
        baseFontSize += 1;
        renderCard(currentIndex);
      }
    });

    fontMinus.addEventListener('click', () => {
      if (baseFontSize > 12) {
        baseFontSize -= 1;
        renderCard(currentIndex);
      }
    });

    // Grid View Generation
    function buildGridView() {
      gridCardsContainer.innerHTML = '';
      cardsData.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = "group bg-[#0e1424] border border-white/10 hover:border-ember-500/60 rounded-xl p-4 cursor-pointer transition transform hover:-translate-y-1 shadow-lg flex flex-col justify-between h-48";
        
        let previewTitle = c.mainTitle || c.title || c.theme;
        let previewSub = c.subTitle || c.headCopy || c.passage || '';
        
        item.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded ${c.type === 'SCRIPTURE' ? 'bg-warmGold-500/20 text-warmGold-300' : 'bg-ember-500/20 text-ember-300'} uppercase font-mono">
                ${c.badge}
              </span>
              <span class="text-[11px] text-slate-500 font-mono">${String(idx + 1).padStart(2, '0')}/13</span>
            </div>
            <h4 class="text-xs sm:text-sm font-bold text-white group-hover:text-warmGold-300 transition line-clamp-2">
              ${previewTitle}
            </h4>
            <p class="text-[11px] text-slate-400 mt-1 line-clamp-2">
              ${previewSub.replace(/[“”"]/g, '')}
            </p>
          </div>
          <div class="text-[10px] text-ember-400 font-medium flex items-center justify-end gap-1">
            보기 →
          </div>
        `;
        item.onclick = () => {
          goToCard(idx);
          toggleViews();
        };
        gridCardsContainer.appendChild(item);
      });
    }

    function toggleViews() {
      const isGridHidden = gridView.classList.contains('hidden');
      if (isGridHidden) {
        buildGridView();
        sliderView.classList.add('hidden');
        gridView.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        gridView.classList.add('hidden');
        sliderView.classList.remove('hidden');
      }
    }

    gridToggleBtn.addEventListener('click', toggleViews);
    closeGridBtn.addEventListener('click', toggleViews);

    // Format Text for Copying to KakaoTalk / SNS
    function getCardPlainText(data) {
      const divider = "=========================";
      let text = `[청소년부 찬양팀 묵상] 베드로의 고백 - 2단계\nCard ${String(data.id + 1).padStart(2, '0')}: ${data.badge}\n${divider}\n`;

      if (data.type === "COVER") {
        text += `[${data.mainTitle}]\n${data.subTitle}\n\n${data.description}\n\n- 찬양 곡: 「베드로의 고백」\n- 청소년부 찬양팀 묵상 2단계`;
      } else if (data.type === "GUIDE") {
        text += `★ ${data.title}\n\n${data.headCopy}\n\n${data.content}\n\n💡 [찬양팀 묵상 포인트]\n${data.point}`;
      } else if (data.type === "SCRIPTURE") {
        text += `📖 [말씀] ${data.theme}\n(${data.passage})\n\n`;
        text += data.verses.map(v => (v.speaker ? `[${v.speaker}] ` : '') + v.text).join('\n\n');
      } else if (data.type === "SHARING") {
        text += `🙏 ${data.title}\n\n${data.headCopy}\n\n${data.scriptureSnip}\n\n[찬양팀 나눔 & 기도 질문]\n`;
        text += data.questions.map(q => `${q.q}\n: ${q.desc}`).join('\n\n');
      }

      return text;
    }

    // Copy to clipboard
    copyCardBtn.addEventListener('click', () => {
      const data = cardsData[currentIndex];
      const copyText = getCardPlainText(data);

      const textarea = document.createElement('textarea');
      textarea.value = copyText;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast(`Card ${currentIndex + 1} 내용이 복사되었습니다! 단톡방에 붙여넣으세요.`);
        } else {
          showToast("복사에 실패했습니다. 수동으로 텍스트를 복사해주세요.");
        }
      } catch (err) {
        showToast("클립보드 접근이 차단되어 있습니다.");
      } finally {
        document.body.removeChild(textarea);
      }
    });

    // Custom Toast Notification
    let toastTimeout = null;
    function showToast(message) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsg.textContent = message;
      toastBox.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toastBox.classList.add('opacity-100', 'translate-y-0');

      toastTimeout = setTimeout(() => {
        toastBox.classList.remove('opacity-100', 'translate-y-0');
        toastBox.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      }, 2600);
    }

    // Initialize
    window.onload = function() {
      renderCard(0);
    };
  </script>
</body>
</html>
