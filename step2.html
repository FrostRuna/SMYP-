        verse: `그들이 아침을 먹은 뒤에, 예수께서 시몬 베드로에게 물으셨다. "요한의 아들 시몬아, 네가 이 사람들보다 나를 더 사랑하느냐?" 베드로가 대답하였다. "예, 주님. 내가 주님을 사랑하는 줄을 주님께서 아십니다." 예수께서 그에게 말씀하셨다. "내 어린 양 떼를 먹여라." 예수께서 두 번째로 그에게 물으셨다. "요한의 아들 시몬아, 네가 나를 사랑하느냐?" 베드로가 대답하였다. "예, 주님. 내가 주님을 사랑하는 줄을 주님께서 아십니다." 예수께서 그에게 말씀하셨다. "내 양 떼를 쳐라." 예수께서 세 번째로 그에게 물으셨다. "요한의 아들 시몬아, 네가 나를 사랑하느냐?" 예수께서 세 번째로 "네가 나를 사랑하느냐?" 하고 물으시므로 베드로는 마음이 아팠다. 그래서 그는 이렇게 대답하였다. <span class="text-amberGlow-300 font-semibold">"주님, 주님께서는 모든 것을 아십니다. 내가 주님을 사랑하는 줄을 주님께서 아십니다."</span> 예수께서 그에게 말씀하셨다. "내 양 떼를 먹여라."`
      },
      {
        type: 'guide',
        step: 'GUIDE 05 · 찬양 가사의 배경',
        headline: `"주님, 모든 것을 아시오매…"\n부서진 자의 진실한 고백`,
        body: [
          `세 번째 질문을 받았을 때 베드로는 마음이 아파 눈물로 고백합니다. "주님, 주님께서는 모든 것을 아십니다. 내가 주님을 사랑하는 줄을 주님께서 아십니다." 찬양 '베드로의 고백'의 가사가 탄생한 결정적 순간입니다.`,
          `과거의 베드로는 "내가 목숨 바쳐 사랑합니다!"라며 자기 의지를 내세웠습니다. 하지만 이제는 떳떳하게 내세울 것이 하나도 없습니다.`,
          `"주님, 저는 비겁하고 또 넘어질 수 있는 연약한 사람입니다. 하지만 그 부서진 마음 깊은 곳에 주님을 사랑하는 진심이 있다는 것만큼은, 제 모든 것을 아시는 주님께서 아십니다." 이것이 진짜 믿음의 반전입니다.`
        ],
        point: `찬양을 부를 때 완벽한 모습을 꾸며내려 애쓰지 마세요. '내 모든 연약함을 아시는 주님, 그래도 주님을 사랑합니다'라는 솔직한 고백이 가장 아름다운 찬양입니다.`
      },
      {
        type: 'guide',
        step: 'GUIDE 06 · 비겁자에서 담대한 사도로',
        headline: `용서받은 사람이 세우는\n교회의 시작`,
        body: [
          `예수님은 고백을 마친 베드로에게 다시 사명을 맡기셨습니다. "내 양 떼를 먹여라." 실패한 제자를 버리지 않으시고 오히려 교회를 돌보는 목자로 다시 세우신 것입니다.`,
          `이후 성령을 받은 베드로는 완전히 다른 사람이 되었습니다. 불과 얼마 전 여종 한 명 앞에서도 벌벌 떨던 그가, 이제는 자신을 죽이려던 대제사장과 공회원들 앞에서 당당히 외쳤습니다.`,
          `"우리는 보고 들은 것을 말하지 않을 수 없습니다!" 은혜로 회복된 한 사람이 세상을 뒤집는 증인이 된 것입니다.`
        ],
        point: `우리가 찬양팀으로 서는 이유는 우리가 대단해서가 아닙니다. 먼저 용서받고 회복된 은혜의 증인이기 때문입니다.`
      },
      {
        type: 'scripture',
        step: 'SCRIPTURE 05 · 표준새번역',
        ref: '사도행전 4장 18절~20절',
        title: `보고 들은 것을 말하지 않을 수 없습니다`,
        verse: `그들은 베드로와 요한을 불러서, 예수의 이름으로 말하지도 말고, 가르치지도 말라고 명령하였다. 그러나 베드로와 요한이 그들에게 대답하였다. <span class="text-amberGlow-300 font-semibold">"하나님의 말씀을 듣는 것보다 당신들의 말을 듣는 것이, 하나님 보시기에 옳은 일인가를 판단해 보십시오. 우리는 보고 들은 것을 말하지 않을 수 없습니다."</span>`
      },
      {
        type: 'sharing',
        step: 'SHARING & PRAYER · 찬양팀 나눔',
        headline: `오늘 우리에게 물으시는 주님의 음성`,
        questions: [
          `이번 주 찬양 콘티를 연습하며, 나의 연약함이나 실수 때문에 주님 앞에 서기 부끄러웠던 순간이 있었나요?`,
          `"주님, 모든 것을 아시오매 내가 주를 사랑하는 줄 주께서 아시나이다"라고 고백할 때, 주님께 솔직히 올려드리고 싶은 내 마음의 고백은 무엇인가요?`
        ],
        prayer: `"모든 것을 아시는 주님, 세 번 부인했던 베드로를 숯불 앞에서 따뜻한 밥상과 세 번의 질문으로 회복시켜 주신 은혜를 기억합니다. 우리의 부족함과 연약함까지 다 아시는 주님 앞에 솔직한 마음으로 나아갑니다. 내 실력과 의지가 아닌, 나를 먼저 사랑하시고 다시 세워주시는 주님의 은혜를 의지하여 '베드로의 고백'을 진심으로 찬양하게 하소서. 예수님의 이름으로 기도합니다. 아멘."`
      }
    ];

    let currentIndex = 0;
    let fontSizeLevel = 1; // 0: 작게, 1: 기본, 2: 크게
    let isGridOpen = false;

    const bodySizeClasses = ['text-[13px] leading-relaxed', 'text-[14.5px] leading-[1.72]', 'text-[16px] leading-[1.75]'];
    const verseSizeClasses = ['text-[13px] leading-[1.75]', 'text-[14.5px] leading-[1.82]', 'text-[16px] leading-[1.85]'];

    const cardContentEl = document.getElementById('cardContent');
    const pageCounterEl = document.getElementById('pageCounter');
    const dotsContainerEl = document.getElementById('dotsContainer');
    const sliderViewEl = document.getElementById('sliderView');
    const gridViewEl = document.getElementById('gridView');
    const gridListEl = document.getElementById('gridList');
    const gridToggleBtn = document.getElementById('gridToggleBtn');
    const gridBtnLabel = document.getElementById('gridBtnLabel');

    function renderDots() {
      dotsContainerEl.innerHTML = '';
      cards.forEach((_, idx) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.setAttribute('aria-label', (idx + 1) + '번 카드로 이동');
        dot.className = idx === currentIndex
          ? 'w-4 h-1.5 rounded-full bg-amberGlow-400 transition-all duration-200'
          : 'w-1.5 h-1.5 rounded-full bg-slate-700 hover:bg-slate-500 transition-all duration-200';
        dot.addEventListener('click', () => {
          currentIndex = idx;
          renderCard();
        });
        dotsContainerEl.appendChild(dot);
      });
    }

    function renderCard() {
      const card = cards[currentIndex];
      const bClass = bodySizeClasses[fontSizeLevel];
      const vClass = verseSizeClasses[fontSizeLevel];

      pageCounterEl.textContent = String(currentIndex + 1).padStart(2, '0') + ' / ' + String(cards.length).padStart(2, '0');
      renderDots();

      cardContentEl.classList.remove('fade-in');
      void cardContentEl.offsetWidth;
      cardContentEl.classList.add('fade-in');

      if (card.type === 'cover') {
        cardContentEl.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="px-3 py-1 rounded-full bg-amberGlow-500/15 border border-amberGlow-500/35 text-amberGlow-300 text-[11px] font-semibold tracking-wide">
              ${card.badge}
            </span>
            <span class="text-xs font-serif text-amberGlow-400/80">STEP 02</span>
          </div>

          <div class="my-auto py-4">
            <div class="w-10 h-[2px] bg-amberGlow-400 mb-5"></div>
            <h1 class="font-serif text-2xl sm:text-[28px] font-bold text-white leading-[1.38] whitespace-pre-line tracking-tight">
              ${card.title}
            </h1>
            <p class="mt-4 text-sm sm:text-[15px] text-slate-300 leading-relaxed whitespace-pre-line">
              ${card.subtitle}
            </p>
          </div>

          <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
            <span>${card.footer}</span>
            <span class="text-amberGlow-400 font-medium">밀어서 시작 →</span>
          </div>
        `;
      } else if (card.type === 'guide') {
        const paragraphs = card.body
          .map(p => `<p class="${bClass} text-slate-200 break-keep">${p}</p>`)
          .join('');

        cardContentEl.innerHTML = `
          <div>
            <div class="text-[11px] font-bold tracking-wider text-amberGlow-400 uppercase mb-2">
              ${card.step}
            </div>
            <h2 class="font-serif text-lg sm:text-xl font-bold text-white leading-[1.4] whitespace-pre-line break-keep">
              ${card.headline}
            </h2>
          </div>

          <div class="my-3 flex-1 overflow-y-auto custom-scroll pr-1 space-y-2.5 flex flex-col justify-center">
            ${paragraphs}
          </div>

          <div class="p-3.5 rounded-2xl bg-amberGlow-500/10 border border-amberGlow-500/30">
            <div class="text-[11px] font-bold text-amberGlow-300 mb-1">찬양팀 묵상 포인트</div>
            <p class="text-xs sm:text-[13px] text-slate-200 leading-relaxed break-keep">
              ${card.point}
            </p>
          </div>
        `;
      } else if (card.type === 'scripture') {
        cardContentEl.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-bold tracking-wider text-amberGlow-400">${card.step}</span>
              <span class="text-xs font-semibold text-amberGlow-300">${card.ref}</span>
            </div>
            <h2 class="font-serif text-base sm:text-lg font-bold text-white leading-snug">
              ${card.title}
            </h2>
          </div>

          <div class="my-3 flex-1 overflow-y-auto custom-scroll pr-1 flex items-center">
            <blockquote class="w-full p-4 rounded-2xl bg-ember-950/75 border border-slate-800/90 font-serif ${vClass} text-slate-200 break-keep">
              “${card.verse}”
            </blockquote>
          </div>

          <div class="text-right text-[11px] text-slate-400">
            성경전서 표준새번역
          </div>
        `;
      } else if (card.type === 'sharing') {
        const qItems = card.questions
          .map((q, i) => `
            <div class="flex items-start gap-2">
              <span class="shrink-0 w-4 h-4 rounded-full bg-amberGlow-500/20 text-amberGlow-300 text-[10px] font-bold flex items-center justify-center mt-0.5">${i + 1}</span>
              <p class="text-xs sm:text-[13px] text-slate-200 leading-relaxed break-keep">${q}</p>
            </div>
          `)
          .join('');

        cardContentEl.innerHTML = `
          <div>
            <div class="text-[11px] font-bold tracking-wider text-amberGlow-400 mb-1">${card.step}</div>
            <h2 class="font-serif text-lg font-bold text-white leading-snug">${card.headline}</h2>
          </div>

          <div class="my-2.5 flex-1 overflow-y-auto custom-scroll pr-1 space-y-2.5 flex flex-col justify-center">
            <div class="p-3 rounded-2xl bg-ember-950/70 border border-slate-800 space-y-2">
              <div class="text-[11px] font-bold text-amberGlow-300">나눔 질문</div>
              ${qItems}
            </div>

            <div class="p-3 rounded-2xl bg-amberGlow-500/10 border border-amberGlow-500/30">
              <div class="text-[11px] font-bold text-amberGlow-300 mb-1">찬양팀 한 줄 기도문</div>
              <p class="text-xs text-slate-200 leading-relaxed italic break-keep">
                ${card.prayer}
              </p>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-1.5 pt-2 border-t border-slate-800/80 text-center text-[11px] font-semibold">
            <a href="step1.html" class="py-2 px-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">← 1단계</a>
            <a href="index.html" class="py-2 px-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">전체 목차</a>
            <a href="step3.html" class="py-2 px-2 rounded-xl bg-amberGlow-500/20 hover:bg-amberGlow-500/30 border border-amberGlow-500/40 text-amberGlow-300 transition">3단계 →</a>
          </div>
        `;
      }
    }

    function renderGrid() {
      gridListEl.innerHTML = '';
      cards.forEach((card, idx) => {
        const item = document.createElement('button');
        item.type = 'button';
        const isCurrent = idx === currentIndex;
        item.className = `p-3.5 rounded-2xl text-left border transition flex flex-col justify-between min-h-[104px] ${
          isCurrent
            ? 'bg-amberGlow-500/15 border-amberGlow-400'
            : 'bg-ember-900 border-slate-800 hover:border-slate-700'
        }`;

        const label = card.step || card.badge || 'CARD';
        const heading = card.headline || card.title || '';

        item.innerHTML = `
          <div class="flex items-center justify-between w-full mb-1.5">
            <span class="text-[10px] font-mono font-bold text-amberGlow-400">${String(idx + 1).padStart(2, '0')}</span>
            <span class="text-[10px] text-slate-400 truncate max-w-[110px]">${label.split('·')[0]}</span>
          </div>
          <div class="text-xs font-bold text-slate-100 line-clamp-2 leading-snug">
            ${heading.replace(/\n/g, ' ')}
          </div>
        `;

        item.addEventListener('click', () => {
          currentIndex = idx;
          toggleGrid(false);
          renderCard();
        });
        gridListEl.appendChild(item);
      });
    }

    function toggleGrid(forceState) {
      isGridOpen = typeof forceState === 'boolean' ? forceState : !isGridOpen;
      if (isGridOpen) {
        renderGrid();
        sliderViewEl.classList.add('hidden');
        gridViewEl.classList.remove('hidden');
        gridBtnLabel.textContent = '카드로 돌아가기';
      } else {
        gridViewEl.classList.add('hidden');
        sliderViewEl.classList.remove('hidden');
        gridBtnLabel.textContent = '모아보기';
      }
    }

    gridToggleBtn.addEventListener('click', () => toggleGrid());

    document.getElementById('fontDownBtn').addEventListener('click', () => {
      if (fontSizeLevel > 0) {
        fontSizeLevel--;
        renderCard();
      }
    });

    document.getElementById('fontUpBtn').addEventListener('click', () => {
      if (fontSizeLevel < 2) {
        fontSizeLevel++;
        renderCard();
      }
    });

    // 키보드 방향키 이동
    document.addEventListener('keydown', (e) => {
      if (isGridOpen) return;
      if (e.key === 'ArrowRight' && currentIndex < cards.length - 1) {
        currentIndex++;
        renderCard();
      } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    });

    // 모바일 터치 스와이프 (세로 스크롤과 구분)
    let touchStartX = 0;
    let touchStartY = 0;
    const cardContainerEl = document.getElementById('cardContainer');

    cardContainerEl.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    cardContainerEl.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;

      if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY) * 1.3) {
        if (diffX < 0 && currentIndex < cards.length - 1) {
          currentIndex++;
          renderCard();
        } else if (diffX > 0 && currentIndex > 0) {
          currentIndex--;
          renderCard();
        }
      }
    }, { passive: true });

    // 단톡방 공유용 텍스트 복사 (카카오톡 브라우저 호환)
    document.getElementById('copyTextBtn').addEventListener('click', () => {
      const shareText = [
        `🔥 [베드로의 고백 묵상 02 — 믿음의 반전]`,
        `세 번의 부인과 세 번의 질문, 찬양의 가사가 된 고백`,
        ``,
        `📖 핵심 말씀 (요한복음 21:17, 표준새번역)`,
        `"주님, 주님께서는 모든 것을 아십니다. 내가 주님을 사랑하는 줄을 주님께서 아십니다."`,
        ``,
        `💡 찬양팀 묵상 포인트`,
        `주님은 우리가 세 번 부인했던 수치스러운 실패의 자리(숯불)를 책망이 아니라 따뜻한 밥상과 세 번의 질문으로 덮어주십니다. 내 의지가 아닌, 모든 연약함을 아시는 주님의 은혜를 의지해 찬양합시다.`,
        ``,
        `🙏 나눔 질문`,
        `1. 나의 연약함이나 실수 때문에 주님 앞에 서기 부끄러웠던 순간이 있었나요?`,
        `2. "주님, 모든 것을 아시오매 내가 주를 사랑하는 줄 주께서 아시나이다"라고 고백할 때, 주님께 솔직히 올려드리고 싶은 내 마음의 고백은 무엇인가요?`,
        ``,
        `👉 카드뉴스로 보기: ${window.location.href}`
      ].join('\n');

      const showToast = () => {
        const toast = document.getElementById('toast');
        toast.classList.remove('opacity-0');
        setTimeout(() => toast.classList.add('opacity-0'), 2400);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareText).then(showToast).catch(() => fallbackCopy(shareText, showToast));
      } else {
        fallbackCopy(shareText, showToast);
      }
    });

    function fallbackCopy(text, callback) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        callback();
      } catch (err) {
        alert('복사에 실패했습니다. 브라우저 주소창 링크를 직접 복사해 주세요.');
      }
      document.body.removeChild(textarea);
    }

    // 초기 렌더링
    renderCard();
  </script>
</body>
</html>
